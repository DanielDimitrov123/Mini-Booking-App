services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking_dev_password
      POSTGRES_DB: mini_booking
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d mini_booking"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
